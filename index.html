<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoMaster — Автосервис</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <div class="logo">🔧 AutoMaster</div>

        <nav class="menu">
            <a href="#services">Услуги</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </div>
</header>

<main>

    <section class="hero">
        <div class="container">

            <p class="hero-label">
                Автосервис полного цикла
            </p>

            <h1>
                Ремонт и обслуживание автомобилей
            </h1>

            <p class="hero-text">
                Диагностика, техническое обслуживание и ремонт.
                Быстро, качественно и по понятной цене.
            </p>

            <a class="button" href="#contacts">
                Записаться на ремонт
            </a>

        </div>
    </section>

    <section id="services" class="section">
        <div class="container">
            <h2>Наши услуги</h2>
        </div>
    </section>

    <section id="about" class="section">
        <div class="container">
            <h2>О нас</h2>
        </div>
    </section>

    <section id="contacts" class="section">
        <div class="container">
            <h2>Контакты</h2>
        </div>
    </section>

</main>

</body>
</html>
